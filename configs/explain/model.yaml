# @package _global_
# Encoder attribution (Integrated Gradients / attention rollout) on a PIGVAE checkpoint
#   uv run scripts/explain/explain_model.py experiment=pigvae ckpt_path=<last.ckpt> method=encoder_ig

defaults:
  - _self_
  - /data: imc
  - /model: model
  - /trainer: default # needed so experiment configs' `override /trainer` composes
  - /paths: szary
  - /experiment: null # must match the checkpoint's architecture
  - /hydra: default # run dir under ${paths.log_dir}/${task_name}

task_name: explain_model
ckpt_path: ???
method: encoder_ig # encoder_ig | rollout | faithfulness (ABMIL attribution: explain/abmil.yaml)
target: 0 # z_global dimension to attribute
n_steps: 50 # Integrated-Gradients steps
to_markers: true # map attributions back to the 768 marker channels (inverse PCA)

split: val # val | test
num_samples: 8

grid_size: 16
out_dir: ${paths.log_dir}/explain/${method}
