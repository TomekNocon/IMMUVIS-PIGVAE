# @package _global_
# Encoder attribution (Integrated Gradients / attention rollout) on a PIGVAE checkpoint
#   uv run scripts/explain_model.py experiment=pigvae ckpt_path=<last.ckpt> method=encoder_ig

defaults:
  - _self_
  - /data: imc
  - /model: model
  - /trainer: default # needed so experiment configs' `override /trainer` composes
  - /paths: szary
  - /experiment: null # must match the checkpoint's architecture

ckpt_path: ???
method: encoder_ig # encoder_ig | rollout | abmil_ig | abmil_attention
target: 0 # z_global dim (encoder_ig) or class-logit column (abmil)
n_steps: 50 # Integrated-Gradients steps
to_markers: true # map attributions back to the 768 marker channels (inverse PCA)

split: val # val | test
num_samples: 8

grid_size: 16
out_dir: explain_outputs
abmil_ckpt: null # trained ABMIL head, only for the abmil_* methods
