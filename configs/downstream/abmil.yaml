# @package _global_
# Gated-ABMIL transfer eval of one PIGVAE checkpoint (scripts/downstream/run_abmil.py)

defaults:
  - /paths: szary
  - /hydra: default # run dir under ${paths.log_dir}/${task_name}
  - _self_

task_name: abmil

downstream_root: /raid_encrypted/immucan/embeddings/tnocon/downstream
run_tag: vae16_s0p001_2026-06-28 # checkpoint bundle under downstream_root
source_tag: zglobal # raw | zglobal | node_mean | node_flatten
meta_dir: ${downstream_root}/${run_tag}/meta_tables/${source_tag}
results_dir: ${downstream_root}/${run_tag}/results/${source_tag}

datasets: [cords]
features: [Grade, Relapse, DX.name, Stage] # targets absent from the table are skipped

num_folds: 10
hidden_dim: 256
num_heads: 8
num_epochs: 100
patience: 20
lr: 1.0e-4
batch_size: 16
zscore: cv_train # fit z-score on each fold's train split only
seed: 42 # fold k uses seed + k
min_class_freq: 0.05
