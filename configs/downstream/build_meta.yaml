# @package _global_
# Join clinical labels onto the encode-stage crop metadata (scripts/downstream/build_abmil_meta.py)

defaults:
  - /paths: szary
  - /hydra: default # run dir under ${paths.log_dir}/${task_name}
  - _self_

task_name: build_meta

downstream_root: ${paths.root_dir}/downstream
run_tag: ??? # checkpoint bundle under downstream_root
source_tag: zglobal # raw | zglobal | node_mean | node_flatten
encode_dir: ${downstream_root}/${run_tag}/mil_embeddings/${source_tag}
out_dir: ${downstream_root}/${run_tag}/meta_tables/${source_tag}

melted_csv: ${paths.data_dir}/clinical/melted_table_images.csv # long table: dataset, image_path, feature, feature_value
dataset: cords
splits: [train, test]
