# @package _global_
# Encode crops with a frozen PIGVAE checkpoint into per-crop MIL features (scripts/encode_mil_embeddings.py)

defaults:
  - /paths: szary
  - _self_

ckpt_path: ???
model_experiment: vae16_fb0p0 # experiment config the checkpoint was trained with (not `experiment`: clashes with the Hydra group)

data_root: /raid_encrypted/immucan/embeddings/tnocon/data/IMC/cords
pca_pkl: ${data_root}/pca_model_128_center_crop_16.pkl
pca_stats: ${data_root}/imc_statistics_128_center_crop_16.pt

downstream_root: /raid_encrypted/immucan/embeddings/tnocon/downstream
run_tag: vae16_s0p001_2026-06-28 # checkpoint bundle under downstream_root
feature_source: zglobal # raw | zglobal | node
node_agg: mean # mean | flatten (node only)
source_tag: zglobal # must equal source_subdir(feature_source, node_agg)
out_dir: ${downstream_root}/${run_tag}/mil_embeddings/${source_tag}

device: cuda
batch_size: 64
splits: [train, test]
