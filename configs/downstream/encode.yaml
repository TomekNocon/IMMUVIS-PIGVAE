# @package _global_
# configs/downstream/encode.yaml
defaults:
  - /paths: szary
  - _self_
ckpt_path: ???            # PIGVAE checkpoint (last.ckpt)
# NOTE: keyed `model_experiment`, NOT `experiment` — a plain `experiment` key collides
# with the `configs/experiment/` group name and becomes un-overridable from the CLI
# (Hydra rejects `experiment=`, `+experiment=`, and `++experiment=`).
model_experiment: vae16_fb0p0   # architecture config the ckpt was trained with
data_root: /raid_encrypted/immucan/embeddings/tnocon/data/IMC/cords
pca_pkl: ${data_root}/pca_model_128_center_crop_16.pkl
pca_stats: ${data_root}/imc_statistics_128_center_crop_16.pt
# Land z_global encode output in this checkpoint's raid downstream bundle (skip-resumable).
downstream_root: /raid_encrypted/immucan/embeddings/tnocon/downstream
run_tag: vae16_s0p001_2026-06-28
out_dir: ${downstream_root}/${run_tag}/mil_embeddings
device: cuda
batch_size: 64
splits: [train, test]
