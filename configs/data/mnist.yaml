_target_: src.data.imc_datamodule.IMCDataModule
hparams:
  data_dir: ${paths.data_dir}
  batch_size: 16 # Needs to be divisible by the number of devices (e.g., if in a distributed setup)
  train_val_test_split: [40843, 10197, 0, 0] # [18108, 5040, 0, 0]
  num_workers: 5
  pin_memory: False
  grid_size: 6
  size: 6
  patch_size: 1
  augmentation_prob: 1.0
  is_contrastive: True
  num_aug_per_sample: 8
  center_crop_size: 6
  num_channels: 768
  num_pca_components: 128
  num_node_features: 128
  normalize: False # If you use PCA do not normalize!
  imc_root: "IMC"
  imc_dataset_names: 
    - "cords"
  zscore: True   # z-score PCA output so all 128 components contribute equally to the loss
  clip_range: 3.0  # clamp features to [-C, C] after PCA; clips 5-8σ outliers in early PCs
  
