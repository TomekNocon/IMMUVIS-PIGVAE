critic:
  _target_: "src.models.components.model.Critic"
  hparams:
    # KLD LOSS SETTINGS - CRITICAL FOR VAE
    # Increased from 0.0001 to prevent posterior collapse while preserving detail
    # For feature space: start higher than pixel space
    kld_loss_scale: 0.0005  # Increased 10x from 0.0001 - prevents ignoring latent code
    kld_free_bits: 2.0  # Free-bits as margin: allow 2 nats/dim before penalizing

    perm_loss_scale: 0.05  # Sinkhorn already enforces bijective assignment; this is a soft backup only
    contrastive_loss_scale: 0.01
    temperature: 0.07
    num_aug_per_sample: ${data.hparams.num_aug_per_sample}
    vae: ${model.graph_ae.hparams.vae}
    huber_beta: 2.0
    alpha_scale: 1.0
    beta_scale: 0.1 #0.1
    gamma_scale: 0.001 # was 0.001; add mild edge preservation

# optimizer:
#   _target_: torch.optim.AdamW
#   _partial_: true
#   lr: 0.0003
#   weight_decay: 0.00005

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0001
  # betas: [0.9, 0.9995]
  # eps: 1e-8
  # fused: true  # remove if your build doesn't support it

scheduler:
  batch_size: ${data.hparams.batch_size}
  type: cosine_warmup
  warmup: 0.05
  max_lr: 0.0001
  div_factor: 10
  final_div_factor: 100

compile: false
