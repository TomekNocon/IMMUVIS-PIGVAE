_target_: "src.models.pigvae_auto_module.PLGraphAE"

graph_ae:
  _target_: "src.models.components.improved_modules.ImprovedGraphAE"
  hparams:
    input_size: 512 # 128
    num_heads: 4
    num_layers: 3
    emb_dim: 512
    vae: true
    dropout: 0.1
    encoder:
      graph_encoder_hidden_dim: ${model.graph_ae.hparams.input_size}
      num_node_features: 64
      num_edge_features: 0
      graph_encoder_num_heads: ${model.graph_ae.hparams.num_heads}
      graph_encoder_ppf_hidden_dim: ${multiply:${model.graph_ae.hparams.input_size},4}
      graph_encoder_num_layers: ${model.graph_ae.hparams.num_layers}
      emb_dim: ${model.graph_ae.hparams.emb_dim}
      dropout: ${model.graph_ae.hparams.dropout}
      grid_size: 7
      project: True
      pooling_type: 'simple'  # NEW: Enable attention pooling instead of CLS token

    decoder:
      graph_decoder_hidden_dim: ${model.graph_ae.hparams.input_size}
      graph_decoder_pos_emb_dim: ${model.graph_ae.hparams.input_size}
      graph_decoder_num_heads: ${model.graph_ae.hparams.num_heads}
      graph_decoder_ppf_hidden_dim: ${multiply:${model.graph_ae.hparams.input_size},4}
      graph_decoder_num_layers: ${model.graph_ae.hparams.num_layers}
      dropout: ${model.graph_ae.hparams.dropout}
      head_dim: ${divide:${model.graph_ae.hparams.input_size},${model.graph_ae.hparams.num_heads}}
      num_embeddings: 170 # not use if is_rope is True
      num_node_features: 64
      num_edge_features: 0
      project: True

    bottle_neck_encoder:
      graph_encoder_hidden_dim: ${model.graph_ae.hparams.input_size}
      emb_dim: ${model.graph_ae.hparams.emb_dim}
      vae: ${model.graph_ae.hparams.vae}
      activation: silu
      num_permutations: ${data.hparams.num_aug_per_sample}

    bottle_neck_decoder:
      emb_dim: ${model.graph_ae.hparams.emb_dim}
      graph_decoder_hidden_dim: ${model.graph_ae.hparams.input_size}

    property_predictor:
      emb_dim: ${model.graph_ae.hparams.emb_dim}
      property_predictor_hidden_dim: ${model.graph_ae.hparams.input_size}
      num_properties: 1

    permuter:
      graph_decoder_hidden_dim: ${model.graph_ae.hparams.input_size}
      graph_decoder_num_heads: ${model.graph_ae.hparams.num_heads}
      graph_decoder_ppf_hidden_dim: ${multiply:${model.graph_ae.hparams.input_size},4}
      dropout: ${model.graph_ae.hparams.dropout}
      num_permutations: ${data.hparams.num_aug_per_sample}
      grid_size: 7
      break_symmetry_scale: 0.05
      emb_dim: ${model.graph_ae.hparams.emb_dim}
      turn_off: True
      use_ce: False
      use_context: False
      head_dim: ${divide:${model.graph_ae.hparams.input_size},${model.graph_ae.hparams.num_heads}}
      n_components: 4

temperature_scheduler:
  _target_: "src.models.components.schedulers.TemperatureScheduler"
  hparams:
    initial_tau: 1.0
    final_tau: 0.7
    num_epochs: ${trainer.max_epochs}
    start_epoch: ${trainer.min_epochs}

entropy_weight_scheduler:
  _target_: "src.models.components.schedulers.EntropyWeightScheduler"
  hparams:
    initial_weight: 0.3
    final_weight: 0.25
    mode: linear
    num_epochs: ${divide:${trainer.max_epochs},2}
    start_epoch: ${trainer.min_epochs}

kld_alpha_scheduler:
  _target_: "src.models.components.schedulers.KLDAlphaScheduler"
  hparams:
    # Warm up KL from 0 to 1x scale over the first half of training
    initial_alpha: 0.0
    final_alpha: 1.0
    mode: linear
    num_epochs: ${divide:${trainer.max_epochs},2}
    start_epoch: ${trainer.min_epochs}

# beta_weight_scheduler:
#   _target_: "src.models.components.schedulers.LinearDecay"
#   hparams:
#     start_value: ${model.critic.hparams.beta_scale}
#     end_value: 0.1
#     start_epoch: ${divide:${trainer.max_epochs},2}
#     end_epoch: ${trainer.max_epochs}

# gamma_weight_scheduler:
#   _target_: "src.models.components.schedulers.LinearWarmupThenConstant"
#   hparams:
#     start: 0.0
#     end: ${model.critic.hparams.gamma_scale}
#     warmup_epochs: ${divide:${trainer.max_epochs},3}

critic:
  _target_: "src.models.components.model.Critic"
  hparams:
    # KLD LOSS SETTINGS - CRITICAL FOR VAE
    # Increased from 0.0001 to prevent posterior collapse while preserving detail
    # For feature space: start higher than pixel space
    kld_loss_scale: 0.001  # Increased 10x from 0.0001 - prevents ignoring latent code
    kld_free_bits: 0.5  # Free-bits as margin (max(KL - fb, 0))

    perm_loss_scale: 0.8
    contrastive_loss_scale: 0.01
    temperature: 0.07
    num_aug_per_sample: ${data.hparams.num_aug_per_sample}
    vae: ${model.graph_ae.hparams.vae}
    huber_beta: 1.0
    alpha_scale: 1.0
    beta_scale: 0.3 #0.1
    gamma_scale: 0.01 # was 0.001; add mild edge preservation

# optimizer:
#   _target_: torch.optim.AdamW
#   _partial_: true
#   lr: 0.0003
#   weight_decay: 0.00005

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0003
  weight_decay: 0.0001
  betas: [0.9, 0.9995]
  eps: 1e-8
  # fused: true  # remove if your build doesn't support it

scheduler:
  batch_size: ${data.hparams.batch_size}
  type: cosine_warmup
  warmup: 0.1
  max_lr: 0.0003
  div_factor: 25
  final_div_factor: 200

compile: false
