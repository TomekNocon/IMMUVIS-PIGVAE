# PIGVAE model: base defaults shared by every experiment config.
# These are the original 6x6 deterministic-AE settings; the final model is experiment=pigvae,
# which overrides the grid size, the VAE and FiLM settings.
_target_: "src.models.pigvae_auto_module.PLGraphAE"

graph_ae:
  _target_: "src.models.components.modules.GraphAE"
  hparams:
    input_size: 512 # transformer width (encoder, decoder, permuter); z_global dimension
    num_heads: 8
    num_layers: 4
    emb_dim: 256 # permuter embedding width
    node_z_dim: 32 # per-node latent dimension
    vae: false # true: Gaussian per-node latent with a KL term
    dropout: 0.05
    encoder:
      graph_encoder_hidden_dim: ${model.graph_ae.hparams.input_size}
      num_node_features: 128 # = number of PCA components
      graph_encoder_num_heads: ${model.graph_ae.hparams.num_heads}
      graph_encoder_ppf_hidden_dim: ${multiply:${model.graph_ae.hparams.input_size},4}
      graph_encoder_num_layers: ${model.graph_ae.hparams.num_layers}
      dropout: ${model.graph_ae.hparams.dropout}
      grid_size: 6
      project: True # linear input projection num_node_features -> width
      use_hadamard: false # structural readout: mean of h_i * h_j over grid edges (parameter-free)
      use_mlp_edges: false # structural readout: mean of MLP([h_i, h_j]) over grid edges
      use_spectrum: false # structural readout: smallest eigenvalues of the content-weighted grid Laplacian
      n_spectral: 8 # eigenvalues kept (use_spectrum only)
      use_pma: false # replace the CLS readout by K-seed cross-attention pooling (PMA)
      pma_k: 4 # PMA seeds (use_pma only)
      qk_norm: true # RMSNorm on queries and keys before attention
      use_final_norm: true # final RMSNorm on the residual stream; off only to load checkpoints trained without it
      neighborhood_radius: 1 # nodes attend within this Manhattan distance on the grid (1 = 4 neighbours)

    decoder:
      graph_decoder_hidden_dim: ${model.graph_ae.hparams.input_size}
      graph_decoder_num_heads: ${model.graph_ae.hparams.num_heads}
      graph_decoder_ppf_hidden_dim: ${multiply:${model.graph_ae.hparams.input_size},4}
      graph_decoder_num_layers: ${model.graph_ae.hparams.num_layers}
      dropout: ${model.graph_ae.hparams.dropout}
      head_dim: ${divide:${model.graph_ae.hparams.input_size},${model.graph_ae.hparams.num_heads}}
      num_node_features: 128
      project: True # linear output projection width -> num_node_features
      node_z_dim: ${model.graph_ae.hparams.node_z_dim}
      grid_size: 6
      use_film: false # condition every decoder layer on z_global via FiLM
      film_bound: false # tanh-bound the FiLM gamma/beta (use with use_film)
      film_weight_decay: null # separate, heavier weight decay for the FiLM projections
      use_final_norm: true # final RMSNorm on the decoder residual stream
      use_rope: false # 1D RoPE over the flattened grid; off, the 2D sinusoidal PE carries position
      pos_bias: none # 2D relative-position bias: none | alibi | swin (replaces the absolute PE)
      encoder_hidden_dim: ${model.graph_ae.hparams.input_size} # z_global dimension (FiLM input)
      qk_norm: true # RMSNorm on queries and keys before attention

    permuter:
      graph_decoder_hidden_dim: ${model.graph_ae.hparams.input_size}
      graph_decoder_num_heads: ${model.graph_ae.hparams.num_heads}
      graph_decoder_ppf_hidden_dim: ${multiply:${model.graph_ae.hparams.input_size},4}
      dropout: ${model.graph_ae.hparams.dropout}
      num_permutations: ${data.hparams.num_aug_per_sample}
      grid_size: 6
      break_symmetry_scale: 0.3 # noise added to the permuter input to break view symmetry
      emb_dim: ${model.graph_ae.hparams.emb_dim}
      turn_off: True # use the known (oracle) view permutations until curriculum_epoch
      curriculum_epoch: 200 # epoch at which the learned permuter takes over (beyond max_epochs = never)
      freeze_epochs: 10 # after the switch, freeze encoder/decoder for this many epochs
      use_ce: False # cross-entropy on the known view order (off)
      use_context: False
      head_dim: ${divide:${model.graph_ae.hparams.input_size},${model.graph_ae.hparams.num_heads}}
      n_components: 16 # spectral positional embedding dimensions

temperature_scheduler: # permuter softmax temperature, decayed over training
  _target_: "src.models.components.schedulers.TemperatureScheduler"
  hparams:
    initial_tau: 1.0
    final_tau: 0.5
    num_epochs: ${trainer.max_epochs}
    start_epoch: ${trainer.min_epochs}

entropy_weight_scheduler: # weight of the permutation-diversity loss
  _target_: "src.models.components.schedulers.EntropyWeightScheduler"
  hparams:
    initial_weight: 0.3
    final_weight: 0.25
    mode: linear
    num_epochs: ${divide:${trainer.max_epochs},2}
    start_epoch: ${trainer.min_epochs}

kld_alpha_scheduler: # KL annealing factor (multiplies critic.kld_loss_scale)
  _target_: "src.models.components.schedulers.KLDAlphaScheduler"
  hparams:
    initial_alpha: 0.0
    final_alpha: 1.0
    mode: linear
    num_epochs: ${divide:${trainer.max_epochs},3}
    start_epoch: 1

critic:
  _target_: "src.models.components.model.Critic"
  hparams:
    kld_loss_scale: 0.05 # KL weight (VAE only)
    kld_free_bits: 0.0 # free nats per latent dimension (0 = plain KL)
    perm_loss_scale: 0.0 # unused: the permutation-loss weight comes from entropy_weight_scheduler
    num_aug_per_sample: ${data.hparams.num_aug_per_sample}
    vae: ${model.graph_ae.hparams.vae}
    huber_beta: 2.0
    alpha_scale: 1.0 # Huber reconstruction weight
    beta_scale: 0.1 # per-node cosine weight
    gamma_scale: 0.001 # grid-gradient weight (edge preservation)

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0007
  weight_decay: 0.01

scheduler:
  batch_size: ${data.hparams.batch_size}
  type: cosine_warmup # cosine_warmup | one_cycle
  warmup: 0.05 # fraction of the steps used for warmup
  max_lr: 0.0003 # one_cycle only
  div_factor: 10 # one_cycle only
  final_div_factor: 100 # one_cycle only

compile: false
