# @package _global_
# Per-node latent diagnostic: local encoder → [B, 36, 16] z_nodes → full-attention decoder
# with 2D sinusoidal PE only. Attention uses RMSNorm-QK; RoPE and FiLM are OFF.
# No permuter in forward pass — tests whether per-node latent alone breaks the val_mse ceiling.
# Run: sbatch scripts/run_pernode_z.sh   (or: python src/train.py experiment=pernode_z_diagnostic logger=wandb trainer=gpu paths=szary)

defaults:
  - override /data: mnist
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["pernode_z", "diagnostic", "no_permuter", "qk_rmsnorm", "no_rope", "no_film", "z16"]

seed: 42

trainer:
  max_epochs: 200
  min_epochs: 1

model:
  graph_ae:
    hparams:
      node_z_dim: 32
      dropout: 0.10
      encoder:
        use_hadamard: false
        use_mlp_edges: false
        use_spectrum: false
        use_pma: false
  optimizer:
    lr: 0.0003
  scheduler:
    max_lr: 0.0003

logger:
  wandb:
    group: "pernode_z"
    tags: ${tags}
    name: "pernode-z16-pe-qknorm-norope-nofilm"
