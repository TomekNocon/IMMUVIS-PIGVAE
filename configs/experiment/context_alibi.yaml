# @package _global_
# Context + decoder-locality experiment (built on the pernode_z diagnostic AE):
#   - encoder dilated mask radius 2 (more local context, D4-equivariant)
#   - decoder ALiBi-2D relative-position bias (soft locality; absolute PE auto-dropped)
#   - hidden 384 (efficiency; 90%-energy rank says ~parity with 512)
#   - final_norm ON, z=32, RoPE/FiLM off, permuter dormant (per-view AE)
# Run: sbatch scripts/run_pernode_z.sh  (set EXPERIMENT) — or:
#   python src/train.py experiment=context_alibi logger=wandb trainer=gpu paths=szary

defaults:
  - override /data: mnist
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["pernode_z", "diagnostic", "no_permuter", "qk_rmsnorm", "no_rope", "no_film",
       "no_latent_norm", "z32", "radius2", "alibi", "h384"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

model:
  graph_ae:
    hparams:
      input_size: 384
      node_z_dim: 32
      dropout: 0.10
      encoder:
        neighborhood_radius: 2
        use_hadamard: false
        use_mlp_edges: false
        use_spectrum: false
        use_pma: false
      decoder:
        pos_bias: alibi
  optimizer:
    lr: 0.0003
  scheduler:
    max_lr: 0.0003

logger:
  wandb:
    group: "context_decoder_bias"
    tags: ${tags}
    name: "ctx-radius2-alibi-h384"
