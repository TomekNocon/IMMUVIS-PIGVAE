# @package _global_

# Quick-sweep setup: short runs that simulate long schedules
# usage:
#   python train.py -m experiment=quick_sweep hparams_search=mnist_optuna logger=wandb

defaults:
  - override /data: mnist
  - override /model: model
  - override /callbacks: default
  - override /trainer: default

tags: ["quick_sweep", "hpo", "pigvae"]

seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 20  # short runs
  gradient_clip_val: 1.0

# Make long-horizon schedulers behave like 500-epoch plans while we stop at ~20
scheduler:
  simulate_epochs: true
  simulated_max_epochs: 500

model:
  temperature_scheduler:
    hparams:
      num_epochs: 500
  entropy_weight_scheduler:
    hparams:
      num_epochs: 250
  compile: false

data:
  hparams:
    batch_size: 64

logger:
  wandb:
    tags: ${tags}
    group: "quick_sweep"

