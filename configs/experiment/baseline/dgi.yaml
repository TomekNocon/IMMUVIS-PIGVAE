# @package _global_
# DGI baseline: Deep Graph Infomax (Velickovic et al., 2019), a contrastive objective on the
# same crop graphs (PCA-128 nodes, 512-d summary = z_global width), one view per crop.
# Downstream: encode with feature_source=dgi, source_tag=dgi.
#
# Run: make train EXPERIMENT=baseline/dgi

defaults:
  - override /data: imc
  - override /model: dgi
  - override /trainer: default
  - override /callbacks: dgi     # generic callbacks; PIGVAE's graph_ae/permuter monitors don't apply
  - _self_

tags: ["baseline", "dgi", "graph_infomax", "pca128", "singleview", "grid16", "h512"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1
  log_every_n_steps: 25     # low so progress is visible early (num_workers=0 is slow: the
                            # datamodule rebuilds an nx.grid_graph per sample, ~255s/epoch)

data:
  hparams:
    grid_size: 16
    size: 16
    center_crop_size: 16
    batch_size: 64
    num_aug_per_sample: 1     # single-view; DGI is D4-invariant so the 8 D4 views are redundant
    num_workers: 0            # single-process loading: num_workers>0 deadlocked (CUDA-before-fork)

model:
  n_h: 512

logger:
  wandb:
    group: "baselines"
    tags: ${tags}
    name: "dgi-pca128-h512-singleview-40ep"
