# @package _global_
# APPLES-TO-APPLES input/width test — clone of vae16_fb0p0_film (the best run 81zasevr,
# balanced s0.01 + FiLM-bound, batch-8 with D4 aug) with EXACTLY two knobs changed:
#   1. PCA 128 -> 256 components (richer input; the encoder currently sees a PCA-128
#      truncation while raw-768 keeps everything -> ceiling traced to input info).
#   2. latent width input_size 512 -> 768 (z_global becomes 768-d = same dim as the
#      raw-768 baseline, so the comparison is apples-to-apples on width too).
# node_z_dim stays 32. Everything else identical to the best run.
# Question: does z_global clear the raw-768 baseline on ALL 4 targets (incl. Relapse)
# once input richness + width are matched? Bundles two changes on purpose (both are
# needed for the equal-footing comparison); attribute with a follow-up rung only if it wins.
#
# Run:
#   sbatch --time=12:00:00 --export=ALL,EXPERIMENT=vae16_fb0p0_film_pca256_z768 scripts/ablation_slurm.sh

defaults:
  - override /data: mnist
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["full_res", "grid16", "pernode_z", "vae", "low_kl", "free_bits", "fb_sweep", "vanilla_vae",
       "kl_anneal", "no_permuter", "qk_rmsnorm", "no_rope", "film", "film_bound", "z32",
       "pca256", "hidden768", "apples_to_apples"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

data:
  hparams:
    grid_size: 16
    size: 16
    center_crop_size: 16
    batch_size: 8
    num_pca_components: 256   # 128 -> 256 (richer input into the encoder)
    num_node_features: 256    # must match num_pca_components (encoder input dim)

model:
  graph_ae:
    hparams:
      input_size: 768         # 512 -> 768 (z_global/CLS width = raw-768 baseline dim)
      vae: true
      node_z_dim: 32
      encoder:
        grid_size: 16
        num_node_features: 256
      decoder:
        grid_size: 16
        num_node_features: 256
        use_film: true          # route z_global (CLS) into the decoder -> reconstruction gradient on it
        film_bound: true        # tanh-bound gamma,beta (the real stabiliser; plain FiLM blew up before)
        film_weight_decay: 0.05  # FiLM projections in a dedicated heavier-decay optimizer group
      permuter:
        grid_size: 16
  critic:
    hparams:
      kld_loss_scale: 0.01   # more-VAE point (full KL pressure vs the s0.001 pair)
      kld_free_bits: 0.0     # vanilla VAE, no dead zone
  kld_alpha_scheduler:
    hparams:
      start_epoch: 5                              # v2 timing (no onset spike)
      num_epochs: ${divide:${trainer.max_epochs},2}

logger:
  wandb:
    group: "full_res"
    tags: ${tags}
    name: "vae16-fb0.0-s0.01-FILM-pca256-z768-40ep"
