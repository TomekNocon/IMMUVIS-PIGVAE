# @package _global_
# PIGVAE: the final IMC model (wandb 81zasevr).
# 16x16 grid of PCA-128 ImmuVis features, per-node VAE (z=32, KL scale 0.01, no free bits,
# annealed in from epoch 5), decoder FiLM-conditioned on z_global (tanh-bounded, own weight decay
# 0.05). Ablations: configs/experiment/ablation/<axis>/.
#
# Run: make train

defaults:
  - override /data: imc
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["full_res", "grid16", "pernode_z", "vae", "low_kl", "free_bits", "fb_sweep", "vanilla_vae",
       "kl_anneal", "no_permuter", "qk_rmsnorm", "no_rope", "film", "film_bound", "z32", "pca128"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

data:
  hparams:
    grid_size: 16
    size: 16
    center_crop_size: 16
    batch_size: 8

model:
  graph_ae:
    hparams:
      vae: true
      node_z_dim: 32
      encoder:
        grid_size: 16
      decoder:
        grid_size: 16
        use_film: true          # route z_global (CLS) into the decoder -> reconstruction gradient on it
        film_bound: true        # tanh-bound gamma,beta (the real stabiliser; plain FiLM blew up before)
        film_weight_decay: 0.05  # FiLM projections in a dedicated heavier-decay optimizer group
      permuter:
        grid_size: 16
  critic:
    hparams:
      kld_loss_scale: 0.01   # more-VAE point (full KL pressure vs the s0.001 pair)
      kld_free_bits: 0.0     # vanilla VAE, no dead zone
  kld_alpha_scheduler:
    hparams:
      start_epoch: 5                              # v2 timing (no onset spike)
      num_epochs: ${divide:${trainer.max_epochs},2}

logger:
  wandb:
    group: "full_res"
    tags: ${tags}
    name: "vae16-fb0.0-s0.01-FILM-start5-40ep"
