# @package _global_
# Spatial-readout ablation, condition B: A + an MLP over the grid edges (1-hop adjacency).
# Shared 6x6-phase setup (vs pigvae): 6x6 centre crop (36 nodes), deterministic AE (no KL),
# no FiLM, lr 3e-4, dropout 0.1, batch 16.
#
# Run: make train EXPERIMENT=ablation/spatial/edges   (whole axis: bash scripts/slurm/submit_ablation.sh spatial)

defaults:
  - override /data: imc
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["spatial_ablation", "condition_B", "mlp_edges"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

model:
  graph_ae:
    hparams:
      dropout: 0.10
      encoder:
        use_hadamard: false
        use_mlp_edges: true
        use_spectrum: false
        use_pma: false
      permuter:
        turn_off: true
        curriculum_epoch: 100
  optimizer:
    lr: 0.0003
  scheduler:
    max_lr: 0.0003

logger:
  wandb:
    group: "spatial_ablation"
    tags: ${tags}
    name: "B-mlp_edges"
