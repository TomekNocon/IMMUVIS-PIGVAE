# @package _global_
# Free-bits ablation (FiLM off): film/no_film with 0.2 free nats per latent dimension (vs 0).
#
# Run: make train EXPERIMENT=ablation/kl/free_bits_0.2   (whole axis: bash scripts/slurm/submit_ablation.sh kl)

defaults:
  - override /data: imc
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["full_res", "grid16", "pernode_z", "vae", "low_kl", "free_bits", "fb_sweep", "kl_anneal",
       "no_permuter", "qk_rmsnorm", "no_rope", "no_film", "z32", "pca128"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

data:
  hparams:
    grid_size: 16
    size: 16
    center_crop_size: 16
    batch_size: 8

model:
  graph_ae:
    hparams:
      vae: true
      node_z_dim: 32
      encoder:
        grid_size: 16
      decoder:
        grid_size: 16
      permuter:
        grid_size: 16
  critic:
    hparams:
      kld_loss_scale: 0.01   # unchanged from jtscgh92
      kld_free_bits: 0.2     # was 0.5 — the only knob that varies across the sweep
  kld_alpha_scheduler:
    hparams:
      start_epoch: 5                              # v2 timing (no onset spike)
      num_epochs: ${divide:${trainer.max_epochs},2}

logger:
  wandb:
    group: "full_res"
    tags: ${tags}
    name: "vae16-fb0.2-s0.01-start5-40ep"
