# @package _global_
# Resolution ablation: a 6x6 centre crop (36 nodes) instead of the full 16x16 grid.
# Changes vs film/no_film: 6x6 grid, free bits 0.5, KL ramped from epoch 1 over max_epochs/3,
# 60 epochs, batch 16.
#
# Run: make train EXPERIMENT=ablation/resolution/grid6

defaults:
  - override /data: imc
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["pernode_z", "vae", "low_kl", "free_bits", "diagnostic", "no_permuter",
       "qk_rmsnorm", "no_rope", "no_film", "z32", "pca128", "grid6"]

seed: 42

trainer:
  max_epochs: 60
  min_epochs: 1

model:
  graph_ae:
    hparams:
      vae: true
      node_z_dim: 32
  critic:
    hparams:
      kld_loss_scale: 0.01   # was 0.05 — ~5x lower effective KL weight
      kld_free_bits: 0.5     # was 0.0 — don't penalise per-dim KL below 0.5 nats

logger:
  wandb:
    group: "vae"
    tags: ${tags}
    name: "vae6-lowkl-fb0.5-s0.01-60ep"
