# @package _global_
# AE vs VAE: film/no_film as a deterministic autoencoder (vae: false, so no KL term; the KL
# settings below are unused).
#
# Run: make train EXPERIMENT=ablation/vae/deterministic_ae

defaults:
  - override /data: imc
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["full_res", "grid16", "no_permuter", "qk_rmsnorm", "no_rope", "no_film", "z32", "pca128"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

data:
  hparams:
    grid_size: 16
    size: 16
    center_crop_size: 16
    batch_size: 8

model:
  graph_ae:
    hparams:
      node_z_dim: 32
      encoder:
        grid_size: 16
      decoder:
        grid_size: 16
      permuter:
        grid_size: 16

logger:
  wandb:
    group: "full_res"
    tags: ${tags}
    name: "full16-z32-pca128-40ep"
