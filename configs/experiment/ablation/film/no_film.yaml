# @package _global_
# FiLM ablation: the final model without FiLM, so z_global gets no reconstruction gradient
# (wandb iaktnnux).
# Changes vs pigvae: decoder use_film / film_bound off, no FiLM weight decay.
# Reference for the kl/* and vae/* ablations.
#
# Run: make train EXPERIMENT=ablation/film/no_film   (whole axis: bash scripts/slurm/submit_ablation.sh film)

defaults:
  - override /data: imc
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["full_res", "grid16", "pernode_z", "vae", "low_kl", "free_bits", "fb_sweep", "vanilla_vae",
       "kl_anneal", "no_permuter", "qk_rmsnorm", "no_rope", "no_film", "z32", "pca128"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

data:
  hparams:
    grid_size: 16
    size: 16
    center_crop_size: 16
    batch_size: 8

model:
  graph_ae:
    hparams:
      vae: true
      node_z_dim: 32
      encoder:
        grid_size: 16
      decoder:
        grid_size: 16
      permuter:
        grid_size: 16
  critic:
    hparams:
      kld_loss_scale: 0.01   # unchanged from jtscgh92
      kld_free_bits: 0.0     # was 0.5 — the only knob that varies across the sweep (vanilla VAE)
  kld_alpha_scheduler:
    hparams:
      start_epoch: 5                              # v2 timing (no onset spike)
      num_epochs: ${divide:${trainer.max_epochs},2}

logger:
  wandb:
    group: "full_res"
    tags: ${tags}
    name: "vae16-fb0.0-s0.01-start5-40ep"
