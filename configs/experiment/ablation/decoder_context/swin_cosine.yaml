# @package _global_
# Decoder-context ablation: decoder_context/swin_huber plus the per-node cosine term (weight 0.3).
#
# Run: make train EXPERIMENT=ablation/decoder_context/swin_cosine

defaults:
  - override /data: imc
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["pernode_z", "diagnostic", "no_permuter", "qk_rmsnorm", "no_rope", "no_film",
       "no_latent_norm", "z32", "radius2", "swin", "h384", "cosine_pernode_0.3"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

model:
  graph_ae:
    hparams:
      input_size: 384
      node_z_dim: 32
      dropout: 0.10
      encoder:
        neighborhood_radius: 2
        use_hadamard: false
        use_mlp_edges: false
        use_spectrum: false
        use_pma: false
      decoder:
        pos_bias: swin
  critic:
    hparams:
      beta_scale: 0.3   # per-node cosine weight
      gamma_scale: 0.0  # gradient term off
  optimizer:
    lr: 0.0003
  scheduler:
    max_lr: 0.0003

logger:
  wandb:
    group: "context_decoder_bias"
    tags: ${tags}
    name: "ctx-radius2-swin-cos03"
