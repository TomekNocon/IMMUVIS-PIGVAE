# @package _global_
# Decoder-context ablation: encoder neighbourhood radius 2 (vs 1) and a 2D ALiBi distance bias
# in the decoder instead of the absolute positional encoding; width 384.
# Shared 6x6-phase setup (vs pigvae): 6x6 centre crop (36 nodes), deterministic AE (no KL),
# no FiLM, lr 3e-4, dropout 0.1, batch 16.
#
# Run: make train EXPERIMENT=ablation/decoder_context/alibi   (whole axis: bash scripts/slurm/submit_ablation.sh decoder_context)

defaults:
  - override /data: imc
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["pernode_z", "diagnostic", "no_permuter", "qk_rmsnorm", "no_rope", "no_film",
       "no_latent_norm", "z32", "radius2", "alibi", "h384"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

model:
  graph_ae:
    hparams:
      input_size: 384
      node_z_dim: 32
      dropout: 0.10
      encoder:
        neighborhood_radius: 2
        use_hadamard: false
        use_mlp_edges: false
        use_spectrum: false
        use_pma: false
      decoder:
        pos_bias: alibi
  optimizer:
    lr: 0.0003
  scheduler:
    max_lr: 0.0003

logger:
  wandb:
    group: "context_decoder_bias"
    tags: ${tags}
    name: "ctx-radius2-alibi-h384"
