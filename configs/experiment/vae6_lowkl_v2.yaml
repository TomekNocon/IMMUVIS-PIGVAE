# @package _global_
# VAE 6x6, follow-up to vae6_lowkl — smooth the KL-onset to kill the ep3 overshoot.
#
# vae6_lowkl was healthy (val_mse 0.040, all 1152 latent dims active) but had a
# one-epoch transient at ep3: val_mse spiked 0.036 -> 0.167 and val_kld crashed
# 1.83 -> 0.277, then self-healed by ep5. Root cause = a SCHEDULE COLLISION:
#   - LR warmup (`scheduler.warmup: 0.05`) ramps to peak over ~5% of steps ≈ ep3,
#   - KL alpha (linear over max_epochs/3) reaches 0.15 by ep3,
#   so peak LR met just-turned-on KL pressure at the same instant.
#
# Fix here: change ONLY the alpha *timing* (recon settles first, KL bites after the
# LR-warmup transient, with smaller per-epoch steps). Everything that made
# vae6_lowkl healthy is unchanged: scale 0.01, free_bits 0.5, LR 7e-4, cosine.
#   - kld_alpha_scheduler.start_epoch: 5   (was the dead default 0 — the scheduler
#     now honours start_epoch; previously it was read from config but ignored.)
#     Holds alpha=0 through the LR-warmup peak (~ep3); KL onset no longer collides.
#   - kld_alpha_scheduler.num_epochs: max_epochs/2  (was /3) — gentler ramp,
#     ~0.033/epoch instead of ~0.05, so each KL step is a smaller perturbation.
#
# Watch: the ep3 region should be smooth now (no val_mse spike / kld crash); final
# latent health should match vae6_lowkl (std_mean ~0.38, active 1152/1152, kld/dim ~0.83).
# If a residual bump remains, the next lever is a longer LR warmup (0.05 -> 0.10) or
# step-based alpha annealing; LR magnitude (7e-4) is fine — the issue was timing.
#
# Run:
#   sbatch --time=10:00:00 --export=ALL,EXPERIMENT=vae6_lowkl_v2 scripts/ablation_slurm.sh
#   or: python src/train.py experiment=vae6_lowkl_v2 logger=wandb trainer=gpu paths=szary
# Inspect: python scripts/diagnose_model.py --ckpt <last.ckpt> --inspect --experiment vae6_lowkl_v2

defaults:
  - override /data: mnist
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["pernode_z", "vae", "low_kl", "free_bits", "kl_anneal", "diagnostic",
       "no_permuter", "qk_rmsnorm", "no_rope", "no_film", "z32", "pca128", "grid6"]

seed: 42

trainer:
  max_epochs: 60
  min_epochs: 1

model:
  graph_ae:
    hparams:
      vae: true
      node_z_dim: 32
  critic:
    hparams:
      kld_loss_scale: 0.01   # unchanged from vae6_lowkl
      kld_free_bits: 0.5     # unchanged from vae6_lowkl
  kld_alpha_scheduler:
    hparams:
      start_epoch: 5                              # delay KL onset past the LR-warmup peak (~ep3)
      num_epochs: ${divide:${trainer.max_epochs},2}  # gentler ramp (was max_epochs/3)

logger:
  wandb:
    group: "vae"
    tags: ${tags}
    name: "vae6-lowkl-v2-start5-anneal30-60ep"
