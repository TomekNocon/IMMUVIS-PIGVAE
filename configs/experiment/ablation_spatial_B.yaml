# @package _global_
# Spatial ablation — Condition B: CLS + stats + MLP edges (1-hop adjacency)
# Run: python src/train.py experiment=ablation_spatial_B logger=wandb trainer=gpu paths=szary

defaults:
  - override /data: mnist
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["spatial_ablation", "condition_B", "mlp_edges"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

model:
  graph_ae:
    hparams:
      dropout: 0.10
      encoder:
        use_hadamard: false
        use_mlp_edges: true
        use_spectrum: false
        use_pma: false
      permuter:
        turn_off: true
        curriculum_epoch: 100
  optimizer:
    lr: 0.0003
  scheduler:
    max_lr: 0.0003

logger:
  wandb:
    group: "spatial_ablation"
    tags: ${tags}
    name: "B-mlp_edges"
