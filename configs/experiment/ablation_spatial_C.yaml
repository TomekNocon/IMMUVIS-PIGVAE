# @package _global_
# Spatial ablation — Condition C: CLS + stats + Laplacian spectrum (global structure)
# Run: python src/train.py experiment=ablation_spatial_C logger=wandb trainer=gpu paths=szary

defaults:
  - override /data: mnist
  - override /model: model
  - override /trainer: default
  - _self_

tags: ["spatial_ablation", "condition_C", "spectrum"]

seed: 42

trainer:
  max_epochs: 40
  min_epochs: 1

model:
  graph_ae:
    hparams:
      dropout: 0.10
      encoder:
        use_hadamard: false
        use_mlp_edges: false
        use_spectrum: true
        n_spectral: 8
        use_pma: false
      permuter:
        turn_off: true
        curriculum_epoch: 100
  optimizer:
    lr: 0.0003
  scheduler:
    max_lr: 0.0003

logger:
  wandb:
    group: "spatial_ablation"
    tags: ${tags}
    name: "C-spectrum"
