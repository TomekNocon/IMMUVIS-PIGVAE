# @package _global_

# example hyperparameter optimization of some experiment with Optuna:
# python train.py -m hparams_search=mnist_optuna experiment=example

defaults:
  - override /hydra/sweeper: optuna

# choose metric which will be optimized by Optuna
# make sure this is the correct name of some metric logged in lightning module!
optimized_metric: "val_loss"

# here we define Optuna hyperparameter search
# it optimizes for value returned from function with @hydra.main decorator
# docs: https://hydra.cc/docs/next/plugins/optuna_sweeper
hydra:
  mode: "MULTIRUN" # set hydra to multirun by default if this config is attached

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

    # storage URL to persist optimization results
    # for example, you can use SQLite if you set 'sqlite:///example.db'
    storage: null

    # name of the study to persist optimization results
    study_name: null

    # number of parallel workers
    n_jobs: 1

    # 'minimize' or 'maximize' the objective
    direction: minimize

    # total number of runs that will be executed
    n_trials: 30

    # choose Optuna hyperparameter sampler
    # you can choose bayesian sampler (tpe), random search (without optimization), grid sampler, and others
    # docs: https://optuna.readthedocs.io/en/stable/reference/samplers.html
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 1234
      n_startup_trials: 10 # number of random sampling runs before optimization starts
      n_ei_candidates: 28
    # define hyperparameter search space
    params:
      # Optimizer / training
      model.optimizer.lr: interval(0.00005, 0.003)
      data.hparams.batch_size: choice(16)
      trainer.max_epochs: choice(20)
      # Simulate long training schedules for LR but stop early
      scheduler.simulate_epochs: choice(true)
      scheduler.simulated_max_epochs: choice(500)
      # Temperature/entropy schedulers behave like long runs
      model.temperature_scheduler.hparams.initial_tau: interval(0.7, 1.0)
      model.temperature_scheduler.hparams.final_tau: interval(0.05, 0.2)
      model.temperature_scheduler.hparams.num_epochs: choice(500)
      model.entropy_weight_scheduler.hparams.initial_weight: interval(0.2, 0.5)
      model.entropy_weight_scheduler.hparams.final_weight:  interval(0.05, 0.3)
      model.entropy_weight_scheduler.hparams.num_epochs: choice(250)
      # KL weighting & free-bits
      model.critic.hparams.kld_loss_scale: interval(1e-5, 5e-3)
      model.critic.hparams.kld_free_bits: interval(0.0, 2.0)
      # Recon terms (keep modest ranges)
      model.critic.hparams.alpha_scale: interval(0.5, 1.5)
      model.critic.hparams.beta_scale: interval(0.05, 0.5)
      model.critic.hparams.gamma_scale: interval(0.001, 0.03)
      # Bottleneck / capacity
      model.graph_ae.hparams.emb_dim: choice(256, 512, 1024)
      model.graph_ae.hparams.num_layers: choice(3, 4, 6)
      model.graph_ae.hparams.num_heads: choice(4, 8)
      model.graph_ae.hparams.dropout: interval(0.0, 0.2)
      # Gumbel / temp
      model.critic.hparams.temperature: interval(0.05, 0.2)
